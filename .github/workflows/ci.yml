name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-pglite:
    name: test (in-process PGlite, Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  test-postgres:
    name: test (real PostgreSQL ${{ matrix.pg }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        pg: [16, 17]
    services:
      postgres:
        image: postgres:${{ matrix.pg }}
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -q -f seed/ecommerce.sql
      - run: npm test
